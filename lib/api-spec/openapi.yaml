openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Columba API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: notes
  - name: groups
  - name: push
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/apple:
    post:
      operationId: signInWithApple
      tags: [auth]
      summary: Sign in with an Apple identity token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleSignInRequest"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/dev-bypass:
    post:
      operationId: devBypassAuth
      tags: [auth]
      summary: Development-only auth bypass using a shared secret code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevBypassRequest"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Bypass disabled in production
  /me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get the current user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update the current user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List notes visible to the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Visible notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a personal or group note
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /notes/summary:
    get:
      operationId: getNotesSummary
      tags: [notes]
      summary: Get note counts and upcoming reminders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notes summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotesSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notes/{id}:
    get:
      operationId: getNote
      tags: [notes]
      summary: Get one visible note
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Edit a visible note
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a visible note
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /notes/{id}/toggle-done:
    post:
      operationId: toggleNoteDone
      tags: [notes]
      summary: Toggle a note's completion state
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /notes/{id}/resend-notification:
    post:
      operationId: resendNoteNotification
      tags: [notes]
      summary: Resend the push notification for a pinned or scheduled note
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List groups the current user belongs to
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /groups/{id}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get a group with its members
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateGroup
      tags: [groups]
      summary: Update a group (emoji, etc.)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Delete a group (admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /groups/{id}/invite:
    post:
      operationId: inviteToGroup
      tags: [groups]
      summary: Invite an email address to a group
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "200":
          description: Invitation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /groups/{id}/members/{userId}:
    delete:
      operationId: removeGroupMember
      tags: [groups]
      summary: Remove a member or leave a group
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /group-invites:
    get:
      operationId: listGroupInvites
      tags: [groups]
      summary: List pending group invitations for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /group-invites/{id}/accept:
    post:
      operationId: acceptGroupInvite
      tags: [groups]
      summary: Accept a group invitation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Joined group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedGroupInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /group-invites/{id}/decline:
    post:
      operationId: declineGroupInvite
      tags: [groups]
      summary: Decline a group invitation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Declined
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /push/register:
    post:
      operationId: registerPushToken
      tags: [push]
      summary: Register a push token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenInput"
      responses:
        "200":
          description: Registered token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: unregisterPushToken
      tags: [push]
      summary: Remove a push token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenDelete"
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
          required: [message, code]
      required: [error]
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
    AppleSignInRequest:
      type: object
      properties:
        identityToken:
          type: string
          minLength: 1
        email:
          type: string
          nullable: true
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
        fullName:
          type: string
          nullable: true
      required: [identityToken]
    DevBypassRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
      required: [code]
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
        displayName:
          type: [string, "null"]
          maxLength: 100
        createdAt:
          type: string
          format: date-time
      required: [id, displayName, createdAt]
    UserUpdate:
      type: object
      properties:
        displayName:
          type: [string, "null"]
          maxLength: 100
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [token, user]
    GroupMember:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
        role:
          type: string
          enum: [admin, member]
        createdAt:
          type: string
          format: date-time
      required: [userId, email, role, createdAt]
    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        emoji:
          type: [string, "null"]
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"
      required: [id, name, emoji, createdByUserId, createdAt, members]
    GroupInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        emoji:
          type: string
          maxLength: 8
      required: [name]
    GroupUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        emoji:
          type: string
          maxLength: 8
    InviteInput:
      type: object
      properties:
        email:
          type: string
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
      required: [email]
    InviteResponse:
      type: object
      properties:
        status:
          type: string
          enum: [pending]
        email:
          type: string
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
        message:
          type: string
      required: [status, email, message]
    GroupInvite:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        groupName:
          type: string
        groupEmoji:
          type: string
        invitedByEmail:
          type: [string, "null"]
        invitedByName:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - groupId
        - groupName
        - groupEmoji
        - invitedByEmail
        - invitedByName
        - createdAt
    AcceptedGroupInvite:
      type: object
      properties:
        groupId:
          type: string
      required: [groupId]
    Note:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: string
        groupId:
          type: [string, "null"]
        groupName:
          type: [string, "null"]
        groupEmoji:
          type: [string, "null"]
        title:
          type: [string, "null"]
        body:
          type: string
        audioUrl:
          type: [string, "null"]
        remindAt:
          type: [string, "null"]
          format: date-time
        reminderSentAt:
          type: [string, "null"]
          format: date-time
        isDone:
          type: boolean
        isPinned:
          type: boolean
        completedByUserId:
          type: [string, "null"]
        completedByEmail:
          type: [string, "null"]
        completedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - ownerId
        - groupId
        - groupName
        - groupEmoji
        - title
        - body
        - audioUrl
        - remindAt
        - reminderSentAt
        - isDone
        - isPinned
        - completedByUserId
        - completedByEmail
        - completedAt
        - createdAt
        - updatedAt
    NoteInput:
      type: object
      properties:
        title:
          type: [string, "null"]
          maxLength: 200
        body:
          type: string
          minLength: 1
        audioUrl:
          type: [string, "null"]
        isPinned:
          type: boolean
        remindAt:
          type: [string, "null"]
          format: date-time
        groupId:
          type: [string, "null"]
      required: [body]
    NoteUpdate:
      type: object
      properties:
        title:
          type: [string, "null"]
          maxLength: 200
        body:
          type: string
          minLength: 1
        audioUrl:
          type: [string, "null"]
        isPinned:
          type: boolean
        remindAt:
          type: [string, "null"]
        groupId:
          type: [string, "null"]
    NotesSummary:
      type: object
      properties:
        total:
          type: number
        open:
          type: number
        completed:
          type: number
        upcomingReminders:
          type: number
      required: [total, open, completed, upcomingReminders]
    PushTokenInput:
      type: object
      properties:
        expoPushToken:
          type: string
        platform:
          type: string
          enum: [ios, android, web]
      required: [expoPushToken, platform]
    PushTokenDelete:
      type: object
      properties:
        expoPushToken:
          type: string
      required: [expoPushToken]